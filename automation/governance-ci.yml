# TEMPLATE ONLY: installing at .github/workflows/governance-ci.yml activates CI.
# A dispatch checks its selected SHA in a separate run; it is not necessarily a PR check status.
name: Proposal checks
run-name: Proposal checks ${{ github.event.client_payload.candidate_commit || github.sha }}
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [community_proposal_check]
permissions:
  contents: read
concurrency:
  group: proposal-checks-${{ github.workflow }}-${{ github.event.client_payload.candidate_commit || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select exact candidate commit
        id: candidate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const sha = process.env.GITHUB_EVENT_NAME === 'repository_dispatch'
            ? event.client_payload?.candidate_commit
            : process.env.GITHUB_EVENT_NAME === 'pull_request'
              ? event.pull_request?.head?.sha
              : process.env.GITHUB_SHA;
          if (typeof sha !== 'string' || !/^[a-f0-9]{40}$/.test(sha)) {
            throw new Error('Invalid candidate commit');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\n`);
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:worker
